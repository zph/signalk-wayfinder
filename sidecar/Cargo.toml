[package]
name = "wayfinder-core-sidecar"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Experimental Rust isochrone calculation sidecar for Signal K Wayfinder"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
